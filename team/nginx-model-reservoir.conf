# 组队协调服务 · nginx 反代配置
#
# 站点：model-reservoir.heilongxiake.cn（用户指定）
# 上游：127.0.0.1:5022（协调服务，只监听回环）
# 证书：复用通配符 *.heilongxiake.cn（至 2026-11-16），不需新签
#
# 落地方式（1Panel 的 openresty 是 Docker 容器）：
#   /opt/1panel/www/sites/model-reservoir.heilongxiake.cn/proxy/root.conf
#   然后 docker exec 1Panel-openresty-R7Ma nginx -t && nginx -s reload
#
# 注意：1Panel 的站点配置同时存在两处 ——
#   文件系统 /opt/1panel/www/sites/<站点>/proxy/*.conf
#   数据库   /opt/1panel/db/agent.db 的 websites.proxy 字段
# 只改文件系统的话，下次在面板点保存会覆盖回去。所以要建站点请走 1Panel 面板，
# 本文件仅作为「面板里该填什么」的参考模板。

# ---- 反代到协调服务 ----
location / {
    proxy_pass http://127.0.0.1:5022;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;

    # 协调服务响应很快（几十毫秒），不需要长超时
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;

    # 请求体上限：密文包单个最大 64KB，给 1MB 余量
    client_max_body_size 1m;
}

# ---- 健康检查路径（给监控用，不带鉴权）----
location = /health {
    proxy_pass http://127.0.0.1:5022/health;
    proxy_http_version 1.1;
    access_log off;
}

# ---- 安全响应头 ----
# 协调服务只返回 JSON，不需要任何缓存，也不该被嵌进别的页面
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy no-referrer always;
