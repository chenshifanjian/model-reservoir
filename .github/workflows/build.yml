name: build

on:
  push:
    branches: [revive]
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Linux build deps (dbus-python compiles from sdist)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev libglib2.0-dev pkg-config

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      # protocol.py 是与服务端仓库共用的密钥派生实现，两份必须字节一致，
      # 否则会出现「客户端加密、服务端验不过码」。服务端仓库：
      #   https://github.com/chenshifanjian/reservoir-team
      # 本工作流不含未受信输入，无命令注入面。
      # Windows runner 的默认 shell 是 PowerShell，这里显式用 bash，
      # 否则 `if ! diff ...` 会被当成 PowerShell 语法报错。
      - name: 协议一致性（与服务端仓库对比）
        shell: bash
        run: |
          set -e
          echo "本仓库 protocol.py:"
          sha256sum protocol.py
          curl -fsSL -o /tmp/server_protocol.py \
            https://raw.githubusercontent.com/chenshifanjian/reservoir-team/main/protocol.py
          if ! diff -q protocol.py /tmp/server_protocol.py > /dev/null; then
            echo "::error::protocol.py 与服务端仓库不一致（协议漂移）。改协议必须两边同时改。"
            diff protocol.py /tmp/server_protocol.py || true
            exit 1
          fi
          echo "protocol.py 与服务端仓库一致"

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Build
        run: pyinstaller --noconfirm --clean 模型蓄水池.spec

      - name: Smoke test (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          # 产物可能是 dist/vX.Y.Z-模型蓄水池 或 dist/ModelReservoir.app/Contents/MacOS/*
          BIN=$(find dist -maxdepth 4 -type f -name 'v*' \
                ! -name '*.exe' ! -name '*.md' ! -name '*.json' | head -1 || true)
          if [ -z "$BIN" ]; then
            BIN=$(find dist -type f -path '*.app/Contents/MacOS/*' | head -1 || true)
          fi
          if [ -z "$BIN" ]; then echo "::error::built binary not found"; exit 1; fi
          echo "binary: $BIN"
          chmod +x "$BIN"
          GATEWAY_HEADLESS=1 GATEWAY_NO_BROWSER=1 "$BIN" > /tmp/gw.log 2>&1 &
          GW_PID=$!
          code=000
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/ || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          echo "GET / -> $code"
          echo "--- gateway log ---"; cat /tmp/gw.log || true
          kill "$GW_PID" 2>/dev/null || true
          [ "$code" = "200" ]

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # 注意：仓库里 dist/ 有 Git LFS 指针版 .exe（134B 文本），必须按体积过滤
          $bin = Get-ChildItem dist -Recurse -Filter '*.exe' |
                 Where-Object { $_.Name -like 'v*' -and $_.Length -gt 1MB } |
                 Sort-Object Length -Descending | Select-Object -First 1
          if (-not $bin) { Write-Error 'built exe not found'; exit 1 }
          Write-Host "binary: $($bin.FullName)"
          $env:GATEWAY_HEADLESS = '1'
          $env:GATEWAY_NO_BROWSER = '1'
          Start-Process $bin.FullName -RedirectStandardOutput gw-out.log -RedirectStandardError gw-err.log
          $code = '000'
          foreach ($i in 1..30) {
            try {
              $r = Invoke-WebRequest -Uri http://127.0.0.1:8000/ -UseBasicParsing -TimeoutSec 2
              $code = [string]$r.StatusCode
            } catch { $code = '000' }
            if ($code -eq '200') { break }
            Start-Sleep -Seconds 1
          }
          Write-Host "GET / -> $code"
          Get-Content gw-out.log, gw-err.log -ErrorAction SilentlyContinue
          Stop-Process -Name ([IO.Path]::GetFileNameWithoutExtension($bin.Name)) -Force -ErrorAction SilentlyContinue
          if ($code -ne '200') { exit 1 }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: model-reservoir-${{ matrix.os }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
